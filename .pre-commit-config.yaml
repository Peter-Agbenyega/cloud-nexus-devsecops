repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-files
          - ^07-templates/devsecops-starter/infra/environments/dev/terraform\.tfvars\.example$

  - repo: local
    hooks:
      - id: terraform-fmt-check
        name: terraform fmt check (starter infra)
        entry: terraform -chdir=07-templates/devsecops-starter/infra fmt -check -recursive
        language: system
        pass_filenames: false
